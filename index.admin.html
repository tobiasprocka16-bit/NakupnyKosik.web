<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Správa skladu</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7385;
    --accent: #2f7d4f; --accent-d: #256640; --danger: #c0392b; --border: #e3e6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1d2129; --text: #e8eaf0; --muted: #98a0b3; --border: #2b303b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 1.25rem; }
  header a { color: var(--muted); text-decoration: none; font-size: .9rem; }
  header a:hover { color: var(--text); }
  main { max-width: 800px; margin: 0 auto; padding: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: 0; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.name { font-weight: 600; text-transform: capitalize; }
  .low { color: var(--danger); font-weight: 600; }
  .add { display: flex; gap: 6px; }
  input { font: inherit; width: 90px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 7px 12px; background: var(--accent); color: #fff; }
  button:hover { background: var(--accent-d); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.ghost:hover { background: var(--bg); color: var(--text); }
  .bar { margin-top: 16px; display: flex; justify-content: flex-end; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.err { background: var(--danger); }
  @media (max-width: 600px) { th:nth-child(2), td:nth-child(2) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>📦 Správa skladu</h1>
  <a href="/">← Späť do obchodu</a>
</header>

<main>
  <div class="panel">
    <table>
      <thead>
        <tr><th>Položka</th><th>Kategória</th><th>Cena</th><th>Na sklade</th><th>Pridať kusy</th></tr>
      </thead>
      <tbody id="telo"></tbody>
    </table>
  </div>
  <div class="bar"><button class="ghost" onclick="resetuj()">Resetovať obchod</button></div>
</main>

<div id="toast"></div>

<script>
const fmt = n => n.toFixed(2).replace(".", ",") + " €";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let toastTimer;
function toast(msg, err = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), 2800);
}

async function nacitaj() {
  const r = await fetch("/api/sklad");
  const sklad = await r.json();
  document.getElementById("telo").innerHTML = sklad.map(p => `
    <tr>
      <td class="name">${esc(p.nazov)}</td>
      <td>${esc(p.kategoria)}</td>
      <td>${fmt(p.cena)}</td>
      <td class="${p.kusy < 5 ? "low" : ""}">${p.kusy} ks</td>
      <td>
        <form class="add" onsubmit="pridaj(event, '${esc(p.nazov)}')">
          <input type="number" min="1" max="100000" value="10" required>
          <button>Pridať</button>
        </form>
      </td>
    </tr>`).join("");
}

async function pridaj(ev, nazov) {
  ev.preventDefault();
  const pocet = parseInt(ev.target.querySelector("input").value, 10);
  try {
    const r = await fetch(`/api/sklad/${encodeURIComponent(nazov)}/pridaj`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pocet }),
    });
    const d = await r.json();
    if (!r.ok) {
      const detail = Array.isArray(d.detail) ? "Neplatný počet (1 – 100 000)" : d.detail;
      throw new Error(detail || "Chyba servera");
    }
    toast(d.sprava);
  } catch (e) {
    toast(e.message, true);
  }
  nacitaj();
}

async function resetuj() {
  if (!confirm("Naozaj resetovať sklad a košík?")) return;
  const r = await fetch("/api/reset", { method: "POST" });
  const d = await r.json();
  toast(d.sprava);
  nacitaj();
}

nacitaj();
</script>
</body>
</html>
